openapi: 3.0.3
info:
  title: neatMon Device API
  version: 1.0.1
  description: >
    API for device communication, firmware updates, and data exchange with neatMon servers.  To find out more about neatMon products please visit [Our Homepage](https://www.neatmon.com). 

    Some useful links:
    - [Knowledge Base](https://info.neatmon.com)

servers:
  - url: http://api.neatmon.io:1330

paths:
  /api/device/{p_guid}:
    post:
      summary: Device data upload
      description: >
        Devices post data to the API with optional firmware/configuration/command responses in return.
        Requests must include a CRC32 header named `x-crc32` that matches the body checksum. Responses will include a matching `x-crc32` header.
      parameters:
        - name: p_guid
          in: path
          required: true
          schema:
            type: string
        - name: x-crc32
          in: header
          required: true
          schema:
            type: string
            description: CRC32 checksum of request body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - t
              properties:
                t:
                  type: number
                  description: Epoch time in milliseconds
                length:
                  type: number
                fw:
                  type: string
                hw:
                  type: string
                pn:
                  type: string
                v:
                  type: object
                body:
                  type: object
      responses:
        '200':
          description: Data received successfully. Optional command object returned.
          headers:
            x-crc32:
              description: CRC-32 checksum of response body
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - t
                properties:
                  t:
                    type: number
                  cfg:
                    $ref: '#/components/schemas/DeviceConfiguration'
                  fwu:
                    $ref: '#/components/schemas/FirmwareUpdate'
                  relay:
                    type: array
                    items:
                      $ref: '#/components/schemas/RelayCommand'
        '400':
          description: Bad request, malformed JSON, or CRC mismatch
        '500':
          description: Internal server error

  /api/device/data/{p_guid}:
    get:
      summary: Retrieve device sensor data
      description: >
        Returns time-series sensor data for a specific device GUID. Results are rate-limited. Use query parameters to specify the time range.
      parameters:
        - name: p_guid
          in: path
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          required: true
          schema:
            type: number
            description: Start date in epoch milliseconds
        - name: endDate
          in: query
          required: true
          schema:
            type: number
            description: End date in epoch milliseconds
      responses:
        '200':
          description: Sensor data retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                      format: date-time
                    metadata:
                      type: object
                      properties:
                        guid:
                          type: string
                        id:
                          type: string
                        sensor:
                          type: string
                        type:
                          type: string
                    data:
                      type: number
        '400':
          description: Query results exceed limits. Reduce requested range.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Error:
                    type: string
                    example: Query results exceed limits. Reduce requested range.
        '404':
          description: No data found
        '429':
          description: Too many requests. Clients must back off and retry later.
          headers:
            Retry-After:
              description: Duration to wait before retrying (in seconds)
              schema:
                type: integer
        '500':
          description: Internal server error

  /api/status/time:
    get:
      summary: Retrieve current server time
      description: Returns the current server epoch time.
      responses:
        '200':
          description: Current time returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  t:
                    type: number
                    description: Epoch time in milliseconds

  /api/status:
    get:
      summary: API status check
      description: Returns a simple status object to confirm API availability.
      responses:
        '200':
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /files/{filename}:
    get:
      summary: Download file by name
      description: >
        Serves static files such as firmware or configuration blobs. Files include a CRC-32 header for verification.
        Large files may be chunked and include additional metadata such as size and version.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File successfully returned
          headers:
            x-crc32:
              description: CRC-32 checksum of file
              schema:
                type: string
            x-file-size:
              description: Size of the file in bytes
              schema:
                type: integer
            x-file-chunks:
              description: Number of file chunks (if chunked transfer)
              schema:
                type: integer
            x-version:
              description: Version of the file
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: CRC mismatch. Returned if downloaded file checksum does not match.
        '404':
          description: File not found

components:
  schemas:
    fwu:
      type: object
      properties:
        uri:
          type: string
          description: Command string for execution of firmware update
    cfg:
      type: object
      properties:
        htp:
          type: object
          description: HTTP communication configuration
          properties:
            srv:
              type: string
              description: HTTP server address
            pth:
              type: string
              description: HTTP request path
            prt:
              type: integer
              description: HTTP server port
            syn:
              type: integer
              description: HTTP sync interval
            als:
              type: integer
              description: HTTP alert sync interval

        mod:
          type: object
          description: Modem configuration
          properties:
            mdl:
              type: string
              description: Modem type
            fw:
              type: integer
              description: Modem firmware version
            apn:
              type: string
              description: Access Point Name
            usr:
              type: string
              description: Modem username
            pwd:
              type: string
              description: Modem password
            rg:
              type: string
              description: Modem registration mode
            dbg:
              type: boolean
              description: Enable modem debug

        wfi:
          type: object
          description: Wi-Fi configuration
          properties:
            ssd:
              type: string
              description: Wi-Fi SSID
            key:
              type: string
              description: Wi-Fi password

        gen:
          type: object
          description: General configuration
          properties:
            dmo:
              type: boolean
              description: Demo mode enable
            bms:
              type: boolean
              description: Battery management enable
            slp:
              type: integer
              description: Sleep mode
            pwr:
              type: integer
              description: Power mode
